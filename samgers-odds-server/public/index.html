<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAMGERS ODDS</title>
<meta name="theme-color" content="#1D3F8F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SAMGERS">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#16202C; --muted:#5B6776; --line:#D5DBE3;
  --brand:#1D3F8F; --gold:#C79A1E; --up:#177245; --down:#B3261E; --chip:#E2E7EE; --soft:#F5F7FA;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1620;--surface:#17212E;--ink:#E7ECF2;--muted:#95A2B3;--line:#2A3747;
  --brand:#8EABF2;--gold:#E0B84A;--up:#4CC38A;--down:#F0776E;--chip:#223044;--soft:#1B2735}
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

header.top{background:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){header.top{background:#132A5E}}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;gap:16px;padding:14px 0 10px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:2.1rem;letter-spacing:.02em;line-height:1;display:flex;align-items:stretch;gap:6px}
.logo b{background:var(--gold);color:#16202C;padding:2px 8px 0;border-radius:3px}
.tagline{font-size:.9rem;opacity:.85;margin-right:auto}
.iconbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:7px 12px;font-weight:600}
.iconbtn:hover{background:rgba(255,255,255,.2)}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;color:#fff;opacity:.7;font-family:var(--display);font-size:1.25rem;font-weight:700;padding:8px 14px 10px;border-bottom:4px solid transparent}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:var(--gold)}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 0}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:3px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
select.sel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600}
.primary{background:var(--gold);color:#16202C;border:0;border-radius:8px;padding:8px 16px;font-weight:700}
.primary:disabled{opacity:.6;cursor:wait}
.meta{font-size:.85rem;color:var(--muted);margin-left:auto}

.day{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:22px 0 8px;text-transform:capitalize}
.game{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.ghead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:12px 14px 8px}
.teams{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.15}
.teams span{color:var(--muted);font-weight:500;padding:0 4px}
.kick{font-size:.9rem;color:var(--muted)}
.league{font-size:.8rem;font-weight:600;background:var(--chip);border-radius:4px;padding:1px 7px}
.status{font-size:.8rem;font-weight:700;color:var(--down)}
.gactions{margin-left:auto;display:flex;gap:6px}
.link{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:.8rem;font-weight:600;color:var(--brand)}
.link:hover{background:var(--soft)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
th,td{padding:7px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:.8rem;font-weight:600;color:var(--muted);background:var(--soft);vertical-align:bottom}
thead th small{display:block;font-weight:400;font-size:.75rem}
tr.mk td{background:var(--soft);font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--brand);padding-top:5px;padding-bottom:5px}
td.name{font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.odd{font-family:var(--display);font-size:1.15rem;font-weight:600}
.pt{font-size:.8rem;color:var(--muted);margin-right:6px}
.empty{color:var(--line);font-family:var(--display);font-size:1.1rem}
td.chg{font-size:.85rem;font-weight:600}
td.chg.up{color:var(--up)} td.chg.down{color:var(--down)} td.chg.flat{color:var(--muted)}
.pub{flex-basis:100%;font-size:.85rem;color:var(--muted)}
.pub b{color:var(--ink);font-weight:600}
.pub.wait b{color:var(--gold)}
.status.live{color:var(--down);display:inline-flex;align-items:center;gap:5px}
.status.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--down);animation:pulse 1.6s infinite}
.status.done{color:var(--muted)}
th.livecol{color:var(--down)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.status.live::before{animation:none}}
.sc{font-family:var(--display);font-size:1.7rem;font-weight:800;color:var(--brand);padding:0 6px}
.books{border-top:1px solid var(--line)}
.books summary{cursor:pointer;padding:9px 14px;font-weight:600;font-size:.9rem;color:var(--brand)}
.books table{min-width:640px}
.books td.best{background:var(--soft)}
.books td.best .odd{color:var(--up);font-weight:700}
.tag{font-size:.72rem;font-weight:700;color:var(--gold);margin-left:6px}
.dlg input.ladder{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--soft);margin-top:4px}

.notice{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:8px;padding:18px 20px;margin:20px 0;max-width:70ch}
.notice h2{font-family:var(--display);margin:0 0 6px;font-size:1.4rem}
.notice p{margin:6px 0;color:var(--muted)}
.legend{font-size:.85rem;color:var(--muted);margin:26px 0 40px;max-width:75ch}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,16,24,.55)}
.dlg{padding:20px 22px}
.dlg h2{font-family:var(--display);margin:0 0 12px;font-size:1.6rem}
.dlg label{display:block;font-weight:600;margin:14px 0 4px}
.dlg input[type=text],.dlg input[type=password]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.dlg .hint{font-size:.85rem;color:var(--muted);margin:4px 0}
.dlg a{color:var(--brand)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 12px}
.checks label{font-weight:500;margin:0;display:flex;gap:8px;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ghost{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:600}
.danger{color:var(--down)}
.dlgfoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line);background:var(--soft)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:90vw;display:none;z-index:10}
@media (max-width:600px){.logo{font-size:1.7rem}.tagline{display:none}.meta{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.langseg{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:6px;overflow:hidden}
.langseg button{background:none;border:0;color:#fff;opacity:.7;padding:6px 10px;font-weight:700;font-size:.85rem}
.langseg button[aria-pressed="true"]{background:var(--gold);color:#16202C;opacity:1}

.login{position:fixed;inset:0;background:var(--brand);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.login.show{display:flex}
.login form{background:var(--surface);color:var(--ink);border-radius:14px;padding:26px 24px;width:min(380px,100%)}
.login .logo{color:var(--ink);font-size:2rem;margin-bottom:6px}
.login label{display:block;font-weight:600;margin:14px 0 4px}
.login input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);font-size:1rem}
.login button{width:100%;margin-top:18px;padding:12px}
.login .err{color:var(--down);font-weight:600;min-height:1.4em;margin:10px 0 0}
.credtable{width:100%;min-width:0;font-size:.9rem}
.credtable td,.credtable th{padding:5px 8px}
.num{width:120px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.warnline{color:var(--down);font-weight:600}
td.fpos{background:rgba(23,114,69,.12)} td.fpos .odd{color:var(--up)}
td.fneg{background:rgba(179,38,30,.10)} td.fneg .odd{color:var(--down)}
.prob{font-size:.72rem;color:var(--muted);font-weight:600;line-height:1.3}
.prob.up{color:var(--up)} .prob.down{color:var(--down)}
.edge{font-size:.72rem;font-weight:700;line-height:1.3}
.edge.pos{color:var(--up)} .edge.neg{color:var(--muted)}
.edge small{font-weight:500}
.props{border-top:1px solid var(--line)}
.props summary{cursor:pointer;padding:9px 14px;font-weight:600;font-size:.9rem;color:var(--brand)}
.pbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 14px 10px}
.pbar .link{font-size:.8rem}
.pbar .on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pmeta{font-size:.78rem;color:var(--muted);padding:0 14px 8px}
.ptable{min-width:0;width:100%}
.ptable td,.ptable th{white-space:normal;vertical-align:top}
.ptable .pl{font-weight:600;text-align:left}
.pline{font-family:var(--display);font-size:1.15rem;font-weight:700}
.pou{font-size:.8rem;color:var(--muted);line-height:1.35}
.pou b{color:var(--ink);font-weight:600}
.popen{font-size:.72rem;color:var(--gold);font-weight:600}
.palts{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.palts span{background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:.78rem;white-space:nowrap}
.palts span b{font-weight:700}
.pempty{padding:4px 14px 14px;color:var(--muted);font-size:.9rem}
.langseg{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:6px;overflow:hidden}
.langseg button{background:none;border:0;color:#fff;opacity:.7;padding:6px 10px;font-weight:700;font-size:.85rem}
.langseg button[aria-pressed="true"]{background:var(--gold);color:#16202C;opacity:1}
body{overflow-x:hidden}
.day{text-transform:none}
.day::first-letter{text-transform:uppercase}
.seg{max-width:100%;overflow-x:auto}
.seg button{white-space:nowrap}
.tabs{overflow-x:auto}
.tab{white-space:nowrap}
@media (max-width:640px){
  .bar{gap:8px;flex-wrap:nowrap;padding:10px 0 6px}
  .logo{font-size:1.3rem;margin-right:auto}
  .langseg button{padding:5px 8px}
  .iconbtn{padding:4px 10px;font-size:0}
  .iconbtn::before{content:'⚙';font-size:1.2rem}
  .tab{font-size:1.05rem;padding:8px 10px 9px}
  .controls{gap:8px;padding:10px 0}
  .seg button{padding:5px 9px}
  .ghead{padding:10px 12px 6px}
  .teams{font-size:1.15rem}
  .sc{font-size:1.4rem;padding:0 4px}
  .gactions{margin-left:0;width:100%}
  .game table{min-width:0;font-size:.85rem}
  .game > .scroll > table{table-layout:fixed;width:100%}
  .game > .scroll > table th:nth-child(1){width:23%}
  .game > .scroll > table th:nth-child(2),.game > .scroll > table th:nth-child(3),.game > .scroll > table th:nth-child(4){width:21%}
  .game > .scroll > table th:nth-child(5){width:14%}
  .game > .scroll > table td,.game > .scroll > table th{overflow-wrap:anywhere}
  .game .books table{min-width:520px}
  th,td{padding:5px 4px}
  th:first-child,td:first-child{padding-left:10px}
  td.name{max-width:26vw;white-space:normal;line-height:1.2;font-size:.8rem}
  .odd{font-size:1rem}
  .pt{margin-right:3px;font-size:.72rem}
  td.chg{white-space:normal;font-size:.64rem;line-height:1.25}
  thead th small{font-size:.66rem;white-space:normal}
  .day{font-size:1.2rem;margin:16px 0 6px}
}
</style>
</head>
<body>
<div class="login" id="login">
  <form id="loginForm" autocomplete="on">
    <div class="logo">SAMGERS <b>ODDS</b></div>
    <p class="hint" data-i18n="loginTitle"></p>
    <label for="lUser" data-i18n="user"></label>
    <input id="lUser" name="username" autocomplete="username" autocapitalize="none" required>
    <label for="lPass" data-i18n="pass"></label>
    <input id="lPass" name="password" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit" data-i18n="loginBtn"></button>
    <p class="err" id="lErr" role="alert"></p>
  </form>
</div>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="logo">SAMGERS <b>ODDS</b></div>
      <div class="tagline" data-i18n="tagline"></div>
      <div class="langseg" id="langSeg" role="group" aria-label="Idioma / Language">
        <button data-l="es">ES</button><button data-l="en">EN</button>
      </div>
      <button class="iconbtn" id="btnSettings" data-i18n="settings"></button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="nfl">NFL</button>
      <button class="tab" role="tab" data-tab="ncaaf">NCAAF</button>
      <button class="tab" role="tab" data-tab="nba">NBA</button>
      <button class="tab" role="tab" data-tab="nhl">NHL</button>
      <button class="tab" role="tab" data-tab="soc" data-i18n="tabSoc"></button>
      <button class="tab" role="tab" data-tab="flips" data-i18n="tabFlips"></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="controls">
    <button class="primary" id="btnRefresh" data-i18n="refresh"></button>
    <select class="sel" id="leagueSel" hidden></select>
    <div class="seg" id="mktSeg">
      <button data-m="all" data-i18n="mkAll"></button><button data-m="h2h">Moneyline</button><button data-m="spreads" data-i18n="mkSpreads"></button><button data-m="totals" data-i18n="mkTotals"></button><button data-m="btts" id="bttsChip">BTTS</button>
    </div>
    <div class="seg" id="flipSeg"><button data-fs="nba">NBA</button><button data-fs="soc">Soccer</button></div>
    <div class="seg" id="viewSeg">
      <button data-v="up" data-i18n="viewUp"></button><button data-v="past" data-i18n="viewPast"></button>
    </div>
    <div class="seg" id="fmtSeg">
      <button data-f="american" data-i18n="fmtAm"></button><button data-f="decimal">Decimal</button>
    </div>
    <div class="meta" id="meta"></div>
  </div>
  <div id="list"></div>
  <p class="legend" data-i18n="legend"></p>
</main>

<dialog id="dlgSettings">
  <div class="dlg">
    <h2 data-i18n="settings"></h2>
    <p class="hint" data-i18n="serverNote"></p>

    <label data-i18n="creditsTitle"></label>
    <div id="credits"></div>

    <label data-i18n="sportsTitle"></label>
    <div class="checks">
      <label><input type="checkbox" id="s_nfl"> NFL</label><label><input type="checkbox" id="s_ncaaf"> NCAAF</label><label><input type="checkbox" id="s_nba"> NBA</label><label><input type="checkbox" id="s_nhl"> NHL</label>
      <label><input type="checkbox" id="s_soc"> <span data-i18n="wSoc"></span></label>
    </div>
    <label style="font-weight:500"><span data-i18n="watchLabel"></span>
      <select class="sel" id="watchMin"><option value="30">30 min</option><option value="60" data-i18n="optHour"></option><option value="120" data-i18n="opt2h"></option></select></label>
    <p class="hint" data-i18n="watchHint"></p>

    <label data-i18n="leaguesTitle"></label>
    <div class="checks" id="leagueChecks"></div>

    <label data-i18n="liveTitle"></label>
    <label style="font-weight:500;margin-top:0"><span data-i18n="liveLabel"></span>
      <select class="sel" id="liveSec"><option value="60">1 min</option><option value="120">2 min</option><option value="300">5 min</option></select></label>
    <p class="hint" data-i18n="liveHint"></p>
    <label for="dailyCap" data-i18n="capTitle"></label>
    <input class="num" id="dailyCap" type="number" min="0" step="100" inputmode="numeric">
    <p class="hint" data-i18n="capHint"></p>

    <div hidden>
    <label data-i18n="booksTitle"></label>
    <div class="checks" id="bookChecks"></div>
    <p class="hint" data-i18n="booksHint"></p>
    </div>

    <label data-i18n="extrasTitle"></label>
    <div class="checks" style="grid-template-columns:1fr">
      <label><input type="checkbox" id="xSoc"> <span data-i18n="xSoc"></span></label>
    </div>
    <p class="hint" data-i18n="ladderHint"></p>
    <input class="ladder" id="ladSoc" type="text" inputmode="decimal">

    <label data-i18n="installTitle"></label>
    <p class="hint" data-i18n="installP"></p>
    <div class="row"><button class="ghost danger" id="btnLogout" type="button" data-i18n="logout"></button></div>
  </div>
  <div class="dlgfoot">
    <button class="ghost" id="btnCancel" type="button" data-i18n="cancel"></button>
    <button class="primary" id="btnSave" data-i18n="save"></button>
  </div>
</dialog>
<div id="toast" role="status"></div>
<script>
const LSK = 'samgers_client_v1';
let S = { lang: (navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'es', fmt: 'american' };
let ui = { tab: 'nfl', league: 'all', mkt: 'all', view: 'up' };
try { const s = JSON.parse(localStorage.getItem(LSK)); if (s) { Object.assign(S, s.S || {}); Object.assign(ui, s.ui || {}); } } catch (e) {}
const saveLocal = () => { try { localStorage.setItem(LSK, JSON.stringify({ S, ui })); } catch (e) {} };

const I18N = {
es: {
  tagline:'Líneas de FanDuel: apertura, día antes y día del partido', settings:'Ajustes', tabSoc:'Fútbol europeo',
  refresh:'Actualizar cuotas', refreshing:'Actualizando…', extrasBusy:'Mercados extra…',
  mkAll:'Todos', mkSpreads:'Handicap', mkTotals:'Totales', viewUp:'Próximos y en vivo', viewPast:'Terminados', fmtAm:'Americana',
  legend:'Cada partido tiene tres líneas. Apertura: la cuota del primer día en que FanDuel publica el partido; la app lo vigila cada hora y guarda la hora en que lo detectó (“Buscar apertura” afina la hora exacta con el histórico). Día antes: la última cuota del día anterior al partido. Día del partido: la cuota actual, que se actualiza sola mientras tengas la app abierta, antes del inicio y en vivo durante el partido. Mov. compara la apertura con la cuota más reciente: ▲ el pago subió, ▼ el pago bajó (más dinero entrando a ese lado).',
  apiKey:'Clave de The Odds API', apiKeyPh:'Pega tu clave aquí', test:'Probar conexión',
  apiHint:'Las cuotas llegan a través de <a href="https://the-odds-api.com" target="_blank" rel="noopener">the-odds-api.com</a>. El plan gratis da 500 créditos al mes; cada “Actualizar” cuesta 3 créditos por liga. Rellenar desde el histórico requiere un plan pagado (10 créditos por mercado en cada lectura).',
  liveTitle:'Cuotas en vivo el día del partido', liveLabel:'Actualizar la línea del día del partido cada',
  liveHint:'Solo corre con la app a la vista y cuando la pestaña que miras tiene partidos hoy. Cuesta 3 créditos por liga en cada actualización; BTTS y líneas de goles se refrescan cada 10 minutos (2 créditos por partido). El marcador en vivo cuesta 2 créditos por liga en cada actualización mientras haya partidos jugándose.',

async function api(path, opts = {}){
  let r;
  try { r = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...opts }); }
  catch (e) { throw new Error(t('net')); }
  if (r.status === 401 && !path.endsWith('/login')) { showLogin(); const e = new Error('auth'); e.auth = true; throw e; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(I18N.es[j.error] ? t(j.error) : (j.error || 'Error ' + r.status)); e.code = j.error; throw e; }
  return j;
}

/* ---------- formato ---------- */
function price(d){
  if (d == null) return null;
  if (S.fmt === 'decimal') return d.toFixed(2);
  if (d >= 2) return '+' + Math.round((d - 1) * 100);
  return String(Math.round(-100 / (d - 1)));
}
const point = p => p == null ? '' : (p > 0 ? '+' + p : String(p));
function val(s, mk, key){
  if (!s || !s.o) return null;
  if (mk === 'totals' && key.endsWith('@main')) {
    const side = key.split('@')[0];
    return s.o.tmain != null && s.o.totals ? s.o.totals[side + '|' + s.o.tmain] : null;
  }
  return s.o[mk] && s.o[mk][key];
}
/* Probabilidad sin margen de la casa (moneyline) */
function fairOf(h){
  if (!h) return null;
  const ks = Object.keys(h).filter(k => h[k] && h[k].p > 1);
  if (ks.length < 2) return null;
  const inv = ks.map(k => 1 / h[k].p), sum = inv.reduce((a, b) => a + b, 0), out = { _margin: sum - 1 };
  ks.forEach((k, i) => { out[k] = inv[i] / sum; });
  return out;
}
const fair = s => fairOf(s && s.o && s.o.h2h);
const pct = x => (x * 100).toFixed(1) + '%';
function cell(s, mk, name){
  const v = val(s, mk, name);
  if (!v) return '<td><span class="empty">—</span></td>';
  const showPt = mk === 'spreads' || mk === 'team_totals' || name.endsWith('@main');
  const pt = showPt ? `<span class="pt">${esc(mk === 'spreads' ? point(v.pt) : v.pt)}</span>` : '';
  const f = mk === 'h2h' ? fair(s) : null;
  const pr = f && f[name] != null ? `<div class="prob">${esc(pct(f[name]))}</div>` : '';
  return `<td>${pt}<span class="odd">${esc(price(v.p))}</span>${pr}</td>`;
}
function h2hExtra(a, b, name){
  if (!b) return '';
  let out = '';
  const fa = fair(a), fb = fair(b);
  if (a && a !== b && fa && fb && fa[name] != null && fb[name] != null) {
    const d = (fb[name] - fa[name]) * 100;
    if (Math.abs(d) >= 0.1) out += `<div class="prob ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲ +' : '▼ '}${d.toFixed(1)} ${esc(t('ppts'))}</div>`;
  }
  return out;
}
function change(a, b, mk, name){
  const x = val(a, mk, name), y = val(b, mk, name);
  const extra = mk === 'h2h' ? h2hExtra(a, b, name) : '';
  if (!x || !y || a === b) return `<td class="chg flat">—${extra}</td>`;
  const parts = [];
  if (x.pt != null && y.pt != null && x.pt !== y.pt) {
    if (mk === 'team_totals') parts.push(`${y.pt > x.pt ? '▲ ' + t('goalsUp') : '▼ ' + t('goalsDown')} ${x.pt} → ${y.pt}`);
    else { const f = mk === 'spreads' ? point : (p => String(p)); parts.push(`${t('line')} ${f(x.pt)} → ${f(y.pt)}`); }
  }
  let cls = mk === 'team_totals' && x.pt != null && y.pt != null && x.pt !== y.pt ? (y.pt > x.pt ? 'up' : 'down') : 'flat';
  if (Math.abs(y.p - x.p) >= 0.005) { if (cls === 'flat') cls = y.p > x.p ? 'up' : 'down'; parts.push((y.p > x.p ? '▲ ' : '▼ ') + price(x.p) + ' → ' + price(y.p)); }
  return `<td class="chg ${cls}">${parts.length ? esc(parts.join(' · ')) : t('noChange')}${extra}</td>`;
}
function outcomeOrder(E, mk, names){
  const soccer = socLike(tabOf(E.sport));
  if (mk === 'btts') return ['Yes','No'].filter(n => names.has(n));
  const order = soccer ? [E.home, 'Draw', E.away] : [E.away, E.home];
  return order.filter(n => names.has(n)).concat([...names].filter(n => !order.includes(n)));
}
const outLabel = n => n === 'Draw' ? t('draw') : n === 'Yes' ? t('yes') : n === 'No' ? t('no') : n;
function ladderOf(tab){ const txt = (socLike(tab) && CFG && CFG.ladder) || ''; return txt.split(',').map(x => parseFloat(x)).filter(x => !isNaN(x)); }
function totalRows(E, snaps){
  const tab = tabOf(E.sport);
  if (!socLike(tab)) return snaps.some(s => s && s.o.tmain != null)
    ? [{key:'Over@main', label:t('over')}, {key:'Under@main', label:t('under')}] : [];
  const lad = ladderOf(tab), lines = new Set(), mains = new Set();
  snaps.forEach(s => { if (!s || !s.o.totals) return; if (s.o.tmain != null) mains.add(s.o.tmain);
    Object.values(s.o.totals).forEach(v => lines.add(v.pt)); });
  const keep = [...lines].filter(p => mains.has(p) || lad.includes(p)).sort((a,b) => a - b);
  const rows = [];
  for (const p of keep) for (const side of ['Over','Under'])
    rows.push({key: side + '|' + p, label: t(side === 'Over' ? 'over' : 'under') + ' ' + p, main: mains.has(p)});
  return rows;
}
function mkLabel(E, mk){
  const tb = tabOf(E.sport);
  if (mk === 'h2h') return socLike(tb) ? t('mkH2hSoc') : 'Moneyline';
  if (mk === 'spreads') return t(socLike(tb) ? 'mkSpreadSoc' : tb === 'nhl' ? 'mkPuck' : 'mkSpreadUS');
  if (mk === 'btts') return t('mkBtts');
  if (mk === 'team_totals') return t('mkTeamGoals');
  return t(socLike(tb) ? 'mkGoals' : tb === 'nhl' ? 'mkGoalsNhl' : 'mkPoints');
}

function pubLine(E){
  if (!E.snaps.open) return E.live ? '' : `<div class="pub wait"><b>${esc(t('notYet', { book: bookOf(E) }))}</b>${E.chk ? ' · ' + esc(t('checked')) + ' ' + esc(fmtTime(E.chk)) : ''}</div>`;

}
function booksHTML(E){
  const B = E.books; if (!B) return '';
  const keys = prioOf(E.sport).filter(k => B.by[k]);
  if (!keys.length) return '';
  const soccer = socLike(tabOf(E.sport));
  const order = soccer ? [E.home, 'Draw', E.away] : [E.away, E.home];
  const get = (o, mk, n) => mk === 'totals' ? (o.tmain != null && o.totals ? o.totals[n + '|' + o.tmain] : null) : (o[mk] && o[mk][n]);
  const mks = (ui.mkt === 'all' ? ['h2h','spreads','totals'] : [ui.mkt]).filter(m => m !== 'btts');
  let body = '';
  for (const mk of mks) {
    const names = (mk === 'totals' ? ['Over','Under'] : order).filter(n => keys.some(k => get(B.by[k], mk, n)));
    if (!names.length) continue;
    body += `<tr class="mk"><td colspan="${keys.length + 1}">${esc(mkLabel(E, mk))}</td></tr>`;
    for (const n of names) {
      const vals = keys.map(k => get(B.by[k], mk, n));
      const best = mk === 'h2h' ? Math.max(...vals.filter(Boolean).map(v => v.p)) : null;
      body += `<tr><td class="name">${esc(mk === 'totals' ? t(n === 'Over' ? 'over' : 'under') : outLabel(n))}</td>` +
        vals.map(v => !v ? '<td><span class="empty">—</span></td>' :
          `<td class="${best != null && keys.length > 1 && v.p === best ? 'best' : ''}">${mk !== 'h2h' ? `<span class="pt">${esc(mk === 'spreads' ? point(v.pt) : v.pt)}</span>` : ''}<span class="odd">${esc(price(v.p))}</span></td>`).join('') + '</tr>';
    }
  }
  if (!body) return '';
  return `<details class="books" ${B.inplay && !E.ended ? 'open' : ''}>
    <summary>${esc(t(B.inplay && !E.ended ? 'booksLive' : E.ended ? 'booksFinal' : 'booksNow'))} · ${esc(fmtKick(B.t))}</summary>
    <div class="scroll"><table><thead><tr><th>${esc(t('market'))}</th>${keys.map(k => `<th>${esc(BOOKS[k])}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>
  </details>`;
}
const PROPS = {}, POPEN = new Set(), PSTAT = {}, PALT = {};
const STATS = [['points', 'pPoints'], ['rebounds', 'pRebounds'], ['assists', 'pAssists'], ['threes', 'pThrees'], ['points_rebounds_assists', 'pPRA'], ['points_rebounds', 'pPR'], ['points_assists', 'pPA'], ['rebounds_assists', 'pRA'], ['steals', 'pSteals'], ['blocks', 'pBlocks'], ['turnovers', 'pTurnovers']];
function propsShell(E){

    <div class="pbody">${POPEN.has(E.id) ? propsBody(E.id) : ''}</div></details>`;

const altLabel = pt => (Math.round(pt * 2) / 2 % 1 === 0.5 ? Math.ceil(pt) + '+' : String(pt));
function propsBody(id){
  const P = PROPS[id];
  if (!P) return `<p class="pempty">${esc(t('pLoading'))}</p>`;
  const st = PSTAT[id] || 'points', alt = !!PALT[id];
  const bar = `<div class="pbar">` +
    STATS.map(([k, l]) => `<button class="link ${k === st ? 'on' : ''}" data-act="pstat" data-id="${esc(id)}" data-v="${k}">${esc(t(l))}</button>`).join('') +
    `<button class="link ${alt ? 'on' : ''}" data-act="palt" data-id="${esc(id)}">${esc(t('pAlt'))}</button>` +
    `<button class="link" data-act="prefresh" data-id="${esc(id)}">${esc(t('pRefresh'))}</button></div>`;
  const cur = P.cur && P.cur.by;
  if (!cur) return bar + `<p class="pempty">${esc(t('pNone'))}</p>`;
  const books = PROPS_BOOKS.filter(b => cur[b]);
  const players = new Set();
  books.forEach(b => Object.keys((cur[b] || {})[st] || {}).forEach(n => players.add(n)));
  const fd = (cur.fanduel || {})[st] || {};
  const list = [...players].sort((a, b) => ((fd[b] && fd[b].main && fd[b].main.pt) || 0) - ((fd[a] && fd[a].main && fd[a].main.pt) || 0));
  const opened = (P.open && P.open.by && P.open.by.fanduel && P.open.by.fanduel[st]) || {};
  const meta = `<div class="pmeta">${esc(t('pUpdated', { t: fmtTime(P.cur.t) }))}</div>`;
  if (!list.length) return bar + meta + `<p class="pempty">${esc(t('pNone'))}</p>`;
  const head = `<thead><tr><th>${esc(t('pPlayer'))}</th>${books.map(b => `<th>${esc(BOOKS[b])}</th>`).join('')}</tr></thead>`;
  const rows = list.map(n => {
    const cells = books.map(b => {
      const x = ((cur[b] || {})[st] || {})[n];
      if (!x) return '<td><span class="empty">—</span></td>';
      if (alt) {
        const alts = Object.values(x.alts || {}).sort((a, c) => a.pt - c.pt);
        if (!alts.length) return '<td><span class="empty">—</span></td>';
        return `<td><div class="palts">${alts.map(a => `<span><b>${esc(altLabel(a.pt))}</b> ${esc(price(a.o) ?? '')}${a.u != null ? ' / ' + esc(t('pUnder')) + ' ' + esc(price(a.u)) : ''}</span>`).join('')}</div></td>`;
      }
      if (!x.main) return '<td><span class="empty">—</span></td>';
      const o = b === 'fanduel' && opened[n] && opened[n].main && opened[n].main.pt !== x.main.pt ? `<div class="popen">${esc(t('pOpened', { x: opened[n].main.pt }))}</div>` : '';
      return `<td><div class="pline">${esc(x.main.pt)}</div><div class="pou">${esc(t('pOver'))} <b>${esc(price(x.main.o) ?? '—')}</b><br>${esc(t('pUnder'))} <b>${esc(price(x.main.u) ?? '—')}</b></div>${o}</td>`;
    }).join('');
    return `<tr><td class="pl">${esc(n)}</td>${cells}</tr>`;
  }).join('');
  return bar + meta + `<div class="scroll"><table class="ptable">${head}<tbody>${rows}</tbody></table></div>`;
}

    if (mk === 'totals') rows = totalRows(E, [...cols, E.last]);
    else if (mk === 'team_totals') {
      const have = new Set(); [...cols, E.last].forEach(x => x && x.o.team_totals && Object.keys(x.o.team_totals).forEach(n => have.add(n)));
      rows = [E.home, E.away].flatMap(tm => ['Over', 'Under'].map(sd => ({ key: `${tm}|${sd}`, label: t(sd === 'Over' ? 'ttOver' : 'ttUnder', { team: tm }) }))).filter(r => have.has(r.key));
    } else {
      const names = new Set();
      [...cols, E.last].forEach(s => s && s.o[mk] && Object.keys(s.o[mk]).forEach(n => names.add(n)));
      rows = outcomeOrder(E, mk, names).map(n => ({key:n, label:outLabel(n)}));
    }
    if (!rows.length) continue;
    const fromSnap = [...cols, E.last].find(x => x && x.o && x.o._from && x.o._from[mk]);
    const fromK = fromSnap && fromSnap.o._from[mk];
    const mg = mk === 'h2h' ? fair(latest) : null;
    body += `<tr class="mk"><td colspan="5">${esc(mkLabel(E, mk))}${mg ? `<span class="tag">${esc(t('margin', { m: pct(mg._margin) }))}</span>` : ''}${fromK ? `<span class="tag">${esc(t('fromOther', { book: BOOKS[fromK] || fromK, main: bookOf(E) }))}</span>` : ''}</td></tr>`;
    for (const r of rows) {
      body += `<tr><td class="name">${esc(r.label)}${r.main ? `<span class="tag">${esc(t('main'))}</span>` : ''}</td>${cols.map(s => cell(s, mk, r.key)).join('')}${change(sn.open, latest, mk, r.key)}</tr>`;
    }
  }
  if (!body) body = `<tr><td colspan="5" style="text-align:left;color:var(--muted)">${esc(t('noOdds', { book: bookOf(E) }))}${ui.mkt !== 'all' ? esc(t('inMarket')) : ''}.</td></tr>`;
  const th = (label, s) => `<th>${esc(label)}<small>${s ? esc(fmtTime(s.t)) + (s.src === 'hist' ? ' · ' + t('histShort') : '') + ((s.b || (s.o && s.o.bk)) && (s.b || s.o.bk) !== primaryOf(E.sport) ? ' · ' + esc(BOOKS[s.b || s.o.bk] || s.b || s.o.bk) : '') : esc(t('noReading'))}</small></th>`;
  const sc = E.score && E.score.h != null ? E.score : null;
  const teams = soccer
    ? (sc ? `${esc(E.home)}<b class="sc">${esc(sc.h)}</b><span>–</span><b class="sc">${esc(sc.a)}</b>${esc(E.away)}` : `${esc(E.home)}<span>vs</span>${esc(E.away)}`)
    : (sc ? `${esc(E.away)}<b class="sc">${esc(sc.a)}</b><span>@</span><b class="sc">${esc(sc.h)}</b>${esc(E.home)}` : `${esc(E.away)}<span>@</span>${esc(E.home)}`);
  return `<article class="game">
    <div class="ghead">
      <div class="teams">${teams}</div>
      <div class="kick">${esc(fmtKick(E.c))}</div>
      ${soccer ? `<span class="league">${esc(leagueName(E.sport))}</span>` : ''}
      ${E.ended ? `<span class="status done">${esc(t(sc && sc.done ? 'final' : 'finished'))}</span>` : started ? (E.live && E.live.inplay ? `<span class="status live">${esc(t('live'))}</span>` : `<span class="status">${esc(t('started'))}</span>`) : ''}
      ${pubLine(E)}
      <div class="gactions">
        <button class="link" data-act="fill" data-id="${esc(E.id)}" title="${esc(t('fillTitle'))}">${esc(t('fill'))}</button>
        <button class="link" data-act="open" data-id="${esc(E.id)}" title="${esc(t('findTitle'))}">${esc(t('findOpen'))}</button>
      </div>
    </div>
    <div class="scroll"><table>
      <thead><tr><th>${esc(t('market'))}</th>${th(t('colOpen'), sn.open)}${th(t('colBefore'), sn.before)}${liveTh(E, isToday)}<th>${esc(t('colMov'))}${latest && latest !== sn.open ? `<small>${esc(t('vsNow', { t: fmtKick(latest.t) }))}</small>` : ''}</th></tr></thead>
      <tbody>${body}</tbody>
    </table></div>
    ${isToday || started ? booksHTML(E) : ''}
    ${E.sport === 'basketball_nba' ? propsShell(E) : ''}
  </article>`;
}


/* ---------- Cambios de signo: líneas que pasaron de − a + (o de + a −) el día antes o el día del partido ---------- */
const sgn = d => (d >= 2 ? '+' : '−');
function srcOf(s, mk){ if (!s || !s.o) return null; return (s.o._from && s.o._from[mk]) || (mk === 'h2h' ? s.o.bk : null) || 'main'; }
function flipRows(E){
  const open = E.snaps.open, before = E.snaps.before, game = E.live;
  if (!open || !open.o || (!before && !game)) return [];
  const soc = socLike(tabOf(E.sport));
  const order = soc ? [E.home, 'Draw', E.away] : [E.away, E.home];
  const all = ['h2h', 'spreads', 'totals', 'team_totals', 'btts'];
  const mks = ui.mkt === 'all' ? all : ui.mkt === 'totals' ? ['totals', 'team_totals'] : [ui.mkt];
  const rows = [];
  for (const mk of mks) {
    if (!open.o[mk]) continue;
    let keys;
    if (mk === 'totals') keys = open.o.tmain != null ? [['Over@main', t('over') + ' ' + open.o.tmain], ['Under@main', t('under') + ' ' + open.o.tmain]] : [];
    else if (mk === 'team_totals') keys = Object.keys(open.o.team_totals).map(k => { const [tm, sd] = k.split('|'); return [k, t(sd === 'Over' ? 'ttOver' : 'ttUnder', { team: tm })]; });
    else keys = order.filter(n => open.o[mk][n]).concat(Object.keys(open.o[mk]).filter(n => !order.includes(n))).map(n => [n, outLabel(n)]);
    for (const [k, label] of keys) {
      const x = val(open, mk, k); if (!x) continue;
      const same = s => s && srcOf(s, mk) === srcOf(open, mk);
      const b = same(before) ? val(before, mk, k) : null, g = same(game) ? val(game, mk, k) : null;
      const fb = b && sgn(b.p) !== sgn(x.p), fg = g && sgn(g.p) !== sgn(x.p);
      if (fb || fg) rows.push({ mk, label, x, b, g, fb, fg });
    }
  }
  return rows;
}
function flipCell(v, mk, flipped){
  if (!v) return '<td><span class="empty">—</span></td>';
  const pt = mk === 'spreads' ? point(v.pt) : (mk === 'team_totals' ? v.pt : '');
  return `<td class="${flipped ? (v.p >= 2 ? 'fpos' : 'fneg') : ''}">${pt !== '' && pt != null ? `<span class="pt">${esc(pt)}</span>` : ''}<span class="odd">${esc(price(v.p))}</span></td>`;
}
function flipsHTML(all, active){
  const pick = ui.flipSport === 'soc' ? (E => String(E.sport).startsWith('soccer_')) : (E => E.sport === 'basketball_nba');
  const evs = all.filter(E => pick(E) && active(E));
  const r = flipsSection(evs, active);
  return `<p class="hint" style="margin:6px 0 14px">${esc(t('flipsIntro'))}</p>` + (r.n ? r.html : `<div class="notice"><h2>${esc(t('flipsNoneT'))}</h2><p>${esc(t('flipsNone'))}</p></div>`);
}
function flipsSection(evs, active){
  const list = evs.slice().sort((a, b) => a.c - b.c);
  let html = '', n = 0;
  for (const E of list) {
    const rows = flipRows(E); if (!rows.length) continue;
    n += rows.length;
    const soc = socLike(tabOf(E.sport));
    const teams = soc ? `${esc(E.home)}<span>vs</span>${esc(E.away)}` : `${esc(E.away)}<span>@</span>${esc(E.home)}`;
    html += `<article class="game"><div class="ghead"><div class="teams">${teams}</div><div class="kick">${esc(fmtTime(E.c))}</div><span class="league">${esc(leagueName(E.sport))}</span></div>
      <div class="scroll"><table><thead><tr><th>${esc(t('market'))}</th><th>${esc(t('colOpen'))}</th><th>${esc(t('colBefore'))}</th><th>${esc(t('colGame'))}</th><th>${esc(t('flipCol'))}</th></tr></thead><tbody>` +
      rows.map(r => {
        const last = r.fg ? r.g : r.b, toPos = last.p >= 2;
        return `<tr><td class="name"><b>${esc(mkLabel(E, r.mk))}</b><br>${esc(r.label)}</td>${flipCell(r.x, r.mk, false)}${flipCell(r.b, r.mk, r.fb)}${flipCell(r.g, r.mk, r.fg)}` +
          `<td class="chg ${toPos ? 'up' : 'down'}">${esc(sgn(r.x.p))} → ${esc(sgn(last.p))}<br><small>${esc(t(r.fg ? 'flipGame' : 'flipBefore'))}</small></td></tr>`;
      }).join('') + `</tbody></table></div></article>`;
  }
  return { html, n };
}
function render(){
  applyStatic();
  if (!busy) document.getElementById('btnRefresh').textContent = t('refresh');
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === ui.tab));
  document.getElementById('bttsChip').hidden = !(socLike(ui.tab) || (ui.tab === 'flips' && ui.flipSport === 'soc'));
  if (ui.mkt === 'btts' && !socLike(ui.tab) && !(ui.tab === 'flips' && ui.flipSport === 'soc')) ui.mkt = 'all';
  document.querySelectorAll('#mktSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === ui.mkt));
  const isFlips = ui.tab === 'flips';
  if (ui.view === 'flips') ui.view = 'up';
  if (ui.flipSport !== 'soc') ui.flipSport = 'nba';
  document.getElementById('viewSeg').style.display = isFlips ? 'none' : '';
  document.getElementById('flipSeg').style.display = isFlips ? '' : 'none';
  document.querySelectorAll('#flipSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.fs === ui.flipSport));
  document.querySelectorAll('#viewSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === ui.view));
  document.querySelectorAll('#fmtSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === S.fmt));
  if (!CFG) return;

  const sel = document.getElementById('leagueSel');
  sel.hidden = !socLike(ui.tab);
  if (socLike(ui.tab)) {
    const on = SPORTS.soc.filter(l => CFG.leagues.includes(l.k));
    if (ui.league !== 'all' && !on.some(l => l.k === ui.league)) ui.league = 'all';
    sel.innerHTML = `<option value="all">${esc(t('allLeagues'))}</option>` + on.map(l => `<option value="${l.k}">${esc(l.n)}</option>`).join('');
    sel.value = ui.league;
  }

  const now = Date.now();
  const lastRun = ST ? Math.max(0, ...Object.values(ST.lastRun || {})) : 0;
  const liveNow = EV.some(E => !E.ended && ((E.c > now && dayKey(E.c) === dayKey(now)) || (E.c <= now && now - E.c < 5 * 3600e3)));
  document.getElementById('meta').innerHTML =
    esc(lastRun ? t('serverUpd', { t: fmtTime(lastRun) }) : t('never')) +
    (liveNow && ST && !ST.capHit ? esc(t('liveOnMeta')) : '') +
    (ST && ST.remaining != null ? esc(t('credits', { n: ST.remaining })) : '') +
    (ST && ST.capHit ? `<span class="warnline">${esc(t('capHitMsg'))}</span>` : '');

  const list = document.getElementById('list');
  if (isFlips) { list.innerHTML = flipsHTML(EV, E => E.c > now || (!E.ended && now - E.c < 5 * 3600e3)); return; }
  if (!CFG.sports[ui.tab]) { list.innerHTML = `<div class="notice"><h2>${esc(t('sportOff'))}</h2><p>${esc(t('sportOffP'))}</p></div>`; return; }
  let evs = EV.filter(E => !socLike(ui.tab) || ui.league === 'all' || E.sport === ui.league);
  const active = E => E.c > now || (!E.ended && now - E.c < 5 * 3600e3);
  evs = ui.view === 'up' ? evs.filter(active).sort((a, b) => a.c - b.c) : evs.filter(E => !active(E)).sort((a, b) => b.c - a.c);
  if (!evs.length) {
    list.innerHTML = `<div class="notice"><h2>${esc(t(ui.view === 'up' ? 'noGames' : 'noPast'))}</h2><p>${esc(t(ui.view === 'up' ? 'noGamesP' : 'noPastP'))}</p></div>`;
    return;
  }
  let html = '', cur = '';
  for (const E of evs) {
    const d = new Date(E.c).toLocaleDateString(loc(), { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' });
    if (d !== cur) { html += `<h2 class="day">${esc(d)}</h2>`; cur = d; }
    html += gameHTML(E);
  }
  list.innerHTML = html;
}

/* ---------- acciones ---------- */
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (!b) return; ui.tab = b.dataset.tab; saveLocal(); EV = []; render(); load(); openStream(); });
document.getElementById('mktSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; ui.mkt = b.dataset.m; saveLocal(); render(); });
document.getElementById('viewSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; ui.view = b.dataset.v; saveLocal(); render(); });
document.getElementById('flipSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; ui.flipSport = b.dataset.fs; saveLocal(); render(); });
document.getElementById('fmtSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.fmt = b.dataset.f; saveLocal(); render(); });
document.getElementById('langSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.lang = b.dataset.l; saveLocal(); render(); });
document.getElementById('leagueSel').addEventListener('change', e => { ui.league = e.target.value; saveLocal(); render(); openStream(); });
document.getElementById('btnRefresh').addEventListener('click', async () => {
  const btn = document.getElementById('btnRefresh');
  busy = true; btn.disabled = true; btn.textContent = t('refreshing');
  try { const j = await api('/api/refresh?tab=' + ui.tab + '&sport=' + (ui.flipSport || 'nba') + '&league=' + encodeURIComponent(ui.tab === 'soc' ? ui.league : 'all'), { method: 'POST' }); if (j.error) toast(t('errPrefix') + j.error, 7000); else if (j.missing) toast(t('missingFd', { n: j.missing }), 8000); else toast(t('updated')); await load(); }
  catch (e) { if (!e.auth) toast(e.message, 7000); }
  busy = false; btn.disabled = false; btn.textContent = t('refresh');
});
document.getElementById('list').addEventListener('toggle', e => {
  const d = e.target; if (!d.matches || !d.matches('details.props')) return;
  const id = d.dataset.pid;
  if (d.open) { POPEN.add(id); d.querySelector('.pbody').innerHTML = propsBody(id); loadProps(id); } else POPEN.delete(id);
}, true);
document.getElementById('list').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const pid = b.dataset.id, act = b.dataset.act;
  if (act === 'pstat' || act === 'palt') {
    if (act === 'pstat') PSTAT[pid] = b.dataset.v; else PALT[pid] = !PALT[pid];
    const el = b.closest('.pbody'); if (el) el.innerHTML = propsBody(pid);
    return;
  }
  if (act === 'prefresh') {
    b.disabled = true;
    try { await api(`/api/events/${encodeURIComponent(pid)}/props/refresh`, { method: 'POST' }); await loadProps(pid); }
    catch (ex) { if (!ex.auth) toast(ex.message, 7000); }
    return;
  }
  const id = encodeURIComponent(b.dataset.id);
  try {
    if (b.dataset.act === 'fill') {
      const j = await api(`/api/events/${id}/fill-before`, { method: 'POST' });
      toast(j.ok ? t('filled') : t(j.reason));
    } else {
      const Eb = EV.find(x => x.id === b.dataset.id), book = Eb ? bookOf(Eb) : 'FanDuel';
      if (!confirm(t('confirmOpen', { book }))) return;
      toast(t('searching'), 60000);
      const j = await api(`/api/events/${id}/find-opening`, { method: 'POST' });
      toast(j.ok ? t(j.exact ? 'openFound' : 'openOld', { t: fmtTime(j.t), book }) : t(j.reason, { book }), 7000);
    }
    load();
  } catch (ex) { if (!ex.auth) toast(t('histErr') + ex.message, 7000); }
});

function creditsHTML(){
  if (!ST) return '';
  const rows = (ST.byKind || []).map(r => `<tr><td>${esc(t('k_' + r.kind))}</td><td>${r.calls}×</td><td>${r.cost}</td></tr>`).join('');
  return `<p><b>${esc(t('creditsLine', { r: ST.remaining ?? '—', u: ST.used24 }))}</b></p>` +
    (rows ? `<div class="scroll"><table class="credtable"><tbody>${rows}</tbody></table></div>` : `<p class="hint">${esc(t('creditsNone'))}</p>`) +
    `<p style="margin-top:14px"><b>${esc(t('statusTitle'))}</b></p>` +
    `<div class="scroll"><table class="credtable"><tbody>${Object.entries(ST.lastRun || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td>${esc(t('k_' + k))}</td><td>${esc(fmtTime(v))}</td></tr>`).join('')}</tbody></table></div>` +
    (ST.lastError ? `<p class="warnline">${esc(t('statusErr', { t: fmtTime(ST.lastError.at), j: t('k_' + ST.lastError.job), m: ST.lastError.message }))}</p>` : `<p class="hint">${esc(t('statusOk'))}</p>`);
}
async function openSettings(){
  try { ST = await api('/api/status'); } catch (e) { if (e.auth) return; }
  document.getElementById('credits').innerHTML = creditsHTML();
  for (const tb of ['nfl', 'ncaaf', 'nba', 'nhl', 'soc']) document.getElementById('s_' + tb).checked = !!CFG.sports[tb];
  document.getElementById('watchMin').value = String(CFG.watchMin);
  document.getElementById('liveSec').value = String(CFG.liveSec);
  document.getElementById('dailyCap').value = CFG.dailyCap;
  document.getElementById('xSoc').checked = !!CFG.extras;
  document.getElementById('ladSoc').value = CFG.ladder;
  document.getElementById('leagueChecks').innerHTML = SPORTS.soc.map(l =>
    `<label><input type="checkbox" value="${l.k}" ${CFG.leagues.includes(l.k) ? 'checked' : ''}> ${esc(l.n)}</label>`).join('');
  document.getElementById('bookChecks').innerHTML = Object.entries(BOOKS).map(([k, n]) =>
    `<label><input type="checkbox" value="${k}" ${k === 'fanduel' ? 'checked disabled' : CFG.books.includes(k) ? 'checked' : ''}> ${esc(n)}</label>`).join('');
  document.getElementById('dlgSettings').showModal();
}
document.getElementById('btnSettings').addEventListener('click', openSettings);
document.getElementById('btnCancel').addEventListener('click', () => document.getElementById('dlgSettings').close());
document.getElementById('btnSave').addEventListener('click', async () => {
  const body = {
    sports: Object.fromEntries(['nfl', 'ncaaf', 'nba', 'nhl', 'soc'].map(tb => [tb, document.getElementById('s_' + tb).checked])),
    watchMin: Number(document.getElementById('watchMin').value),
    liveSec: Number(document.getElementById('liveSec').value),
    dailyCap: Number(document.getElementById('dailyCap').value),
    extras: document.getElementById('xSoc').checked,
    ladder: document.getElementById('ladSoc').value,
    leagues: [...document.querySelectorAll('#leagueChecks input:checked')].map(i => i.value),
    books: [...document.querySelectorAll('#bookChecks input:checked:not(:disabled)')].map(i => i.value)
  };
  try { const j = await api('/api/config', { method: 'PUT', body: JSON.stringify(body) }); CFG = j.config; document.getElementById('dlgSettings').close(); toast(t('saved')); load(); }
  catch (e) { if (!e.auth) toast(e.message, 7000); }
});
document.getElementById('btnLogout').addEventListener('click', async () => {
  try { await api('/api/logout', { method: 'POST' }); } catch (e) {}
  document.getElementById('dlgSettings').close(); EV = []; CFG = null; showLogin();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
applyStatic(); boot();

</script>
